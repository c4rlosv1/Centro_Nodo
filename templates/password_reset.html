{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">📩</div>
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa el correo registrado con tu cuenta para enviarte un enlace de recuperación.</p>
        </div>

        <form method="POST" class="auth-form" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email">{{ form.email.label }}</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <span class="field-error">{{ form.email.errors.0 }}</span>
                {% endif %}
            </div>

            <button type="submit" class="btn btn-primary btn-block">Enviar enlace de recuperación</button>
        </form>

        <div class="auth-footer-help">
            <a href="{% url 'login' %}" class="back-link">← Volver al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
