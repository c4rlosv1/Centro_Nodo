<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Nodo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script src="{% static 'js/theme.js' %}" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Centro Nodo</h1>
            <nav>
                <ul>
                    <li><a href="{% url 'home' %}">Inicio</a></li>
                    <li><a href="{% url 'agendamiento' %}">Agendamiento</a></li>
                    <li><a href="{% url 'telemedicina' %}">Telemedicina</a></li>
                    <li><a href="#">Pacientes</a></li>
                    <li><a href="#">Fichas Clínicas</a></li>
                    <li><button id="theme-toggle" class="theme-toggle">🌙</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centro Nodo - Sistema de Gestión Clínica</p>
        </div>
    </footer>
</body>
</html>
